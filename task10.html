<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Board</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
           
            display: flex;
            justify-content: center;
            align-items: center;
            background: #222;
            font-family: Arial, sans-serif;
        }

        .board-container {
            width: 600px;
            padding: 45px;
            background: #e53935;
            position: relative;
        }

        .board {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            border: 1px solid #333;
        }

        .square {
            aspect-ratio: 1 / 1;
        }

        .square:nth-child(odd) {
            background: #f5f5f5;
        }

        .square:nth-child(even) {
            background: #30343b;
        }

        /* Reverse colors on every alternate row */
        .square:nth-child(n+9):nth-child(-n+16),
        .square:nth-child(n+25):nth-child(-n+32),
        .square:nth-child(n+41):nth-child(-n+48),
        .square:nth-child(n+57):nth-child(-n+64) {
            background: #30343b;
        }

        .square:nth-child(n+9):nth-child(-n+16):nth-child(even),
        .square:nth-child(n+25):nth-child(-n+32):nth-child(even),
        .square:nth-child(n+41):nth-child(-n+48):nth-child(even),
        .square:nth-child(n+57):nth-child(-n+64):nth-child(even) {
            background: #f5f5f5;
        }

        /* Top numbers */
        .top-numbers {
            position: absolute;
            top: 8px;
            left: 45px;
            right: 45px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            text-align: center;
            color: white;
            font-size: 20px;
        }

        /* Bottom numbers */
        .bottom-numbers {
            position: absolute;
            bottom: 8px;
            left: 45px;
            right: 45px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            text-align: center;
            color: white;
            font-size: 20px;
        }

        /* Left numbers */
        .left-numbers {
            position: absolute;
            top: 45px;
            bottom: 45px;
            left: 12px;
            display: grid;
            grid-template-rows: repeat(8, 1fr);
            align-items: center;
            color: white;
            font-size: 20px;
        }

        /* Right numbers */
        .right-numbers {
            position: absolute;
            top: 45px;
            bottom: 45px;
            right: 12px;
            display: grid;
            grid-template-rows: repeat(8, 1fr);
            align-items: center;
            color: white;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="board-container">

        <div class="top-numbers">
            <span>1</span>
            <span>2</span>
            <span>3</span>
            <span>4</span>
            <span>5</span>
            <span>6</span>
            <span>7</span>
            <span>8</span>
        </div>

        <div class="left-numbers">
            <span>1</span>
            <span>2</span>
            <span>3</span>
            <span>4</span>
            <span>5</span>
            <span>6</span>
            <span>7</span>
            <span>8</span>
        </div>

        <div class="right-numbers">
            <span>1</span>
            <span>2</span>
            <span>3</span>
            <span>4</span>
            <span>5</span>
            <span>6</span>
            <span>7</span>
            <span>8</span>
        </div>

        <div class="bottom-numbers">
            <span>1</span>
            <span>2</span>
            <span>3</span>
            <span>4</span>
            <span>5</span>
            <span>6</span>
            <span>7</span>
            <span>8</span>
        </div>

        <div class="board">
            <!-- Row 1 -->
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>

            <!-- Row 2 -->
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>

            <!-- Row 3 -->
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>

            <!-- Row 4 -->
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>

            <!-- Row 5 -->
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>

            <!-- Row 6 -->
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>

            <!-- Row 7 -->
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>

            <!-- Row 8 -->
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>
        </div>

    </div>

</body>
</html>
