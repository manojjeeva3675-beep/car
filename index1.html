<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lamborghini Contact</title>
    <link rel="stylesheet" href="procon.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.1.0/css/all.min.css">
    
</head>

<body>
    
    <section class="contact">

        <h1>LAMBORGHINI</h1>
        <h2>CONTACT US</h2>
        <div class="name"><a href="http://127.0.0.1:5500/project2.html">Home</a></div>

        <div class="contact-container">

            <div class="contact-info">
                <h3>GET IN TOUCH</h3>
                <p>Have a question? Contact Lamborghini.</p>

                <p>📍 Lamborghini Showroom</p>
                <p>📞 +91 8754754586</p>
                <p>✉️ info@lamborghini.com</p>
            </div>

            <form>

                <input type="text" placeholder="Your Name">

                <input type="email" placeholder="Your Email">

                <input type="text" placeholder="Subject">

                <textarea placeholder="Your Message"></textarea>

                <button type="submit">SEND MESSAGE</button>

            </form>

        </div>

    </section>

</body>
</html>
