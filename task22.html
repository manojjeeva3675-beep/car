<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atm</title>
    <link rel="stylesheet" href="./task22.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
</head>
<body>
    <div class="atm-card">
        <div class="card">
        <div class="front">
            <div class="box logo">
                <img src="./state.jpeg" alt="">
            </div>
            <div class="box bank_name">
                <h1>State Bank of India</h1>
            </div>
            <div class="box card_number">
                <h2>SBK0101100007</h2>
            </div>
            <div class="box wifi_icon">
                <i class="fa-solid fa-wifi"></i>
            </div>
            <!-- <div class="chip">
                <img src="./chip.jpg"width="50"height="50">
            </div> -->

            <div class="box valid_from">
                <p>VALID <br> FROM</p>
                <p>03/25</p>
            </div>
            <div class="box valid_upto">
                <p>VALID <br> UPTO</p>
                <p>03/35</p>
            </div>
            <div class="box account_name">
                <h2>manoj</h2>
            </div>
            <div class="box rupay_logo">
                <img src="./rupay.png" alt="">
            </div>
        </div>
        <div class="back">
            <h3>Enjoy Banking with Us!!!</h3>
            <div class="black-line"></div>
            <div class="back-heading">
                <img src="./state.jpeg" alt="sbi">
                <h2>FinSmiles</h2>
            </div>
            <p>Future Ready-Financially Happy</p>
        </div>
    </div>
    </div>
</body>
</html>
